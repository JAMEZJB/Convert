name: Publish Docker Image

# NOTE (fork maintainer): upstream's container publish. Neutralised to manual-dispatch only in this
# REPACKAGING fork. Its original `tags: ["*"]` trigger would fire on the `build-YYYYMMDD` release tags
# that `desktop-build.yml` creates, pushing a container image to ghcr.io on every desktop release — not
# wanted, and a cost. This fork does not publish a container (upstream does, at its own repo). Kept to
# preserve upstream parity.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          arguments: |
            VITE_COMMIT_SHA=${{ github.sha }}
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
