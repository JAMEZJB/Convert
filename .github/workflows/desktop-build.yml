# Desktop build — repackages this fork's upstream (p2r3/convert) as a standalone Electron app
# for the JBTheatreTools launcher, tracking upstream on a COST-CAPPED schedule.
#
# Cost control (macOS runners are billed heavily):
#   * runs fortnightly (1st + 15th) or on manual dispatch — never on every push;
#   * a cheap Ubuntu `check` job first asks whether upstream p2r3/convert has actually moved since the
#     last build; the expensive mac/windows build jobs run ONLY when it has (`if: needs.check.outputs.changed`).
#   * so a quiet fortnight costs one tiny API check and nothing else.
#   * ONE universal mac job (not one-per-arch) — electron-builder emits a universal .app from a single runner.
#
# What it builds: upstream's OWN Electron target. The build jobs check out p2r3/convert at the EXACT sha the
# check job found and run upstream's own pipeline (Bun -> `bun install` (recursive submodules) -> upstream's
# `desktop:build`, then electron-builder). The app is unmodified except for packaging: the only overrides are
# electron-builder's output shape (universal mac .zip / x64 .exe) and disabling code-signing — all via CLI
# flags, so the upstream tree itself is untouched. `built-from: <upstream sha>` in the release body is therefore
# always truthful, and the check job reads it back to decide "has upstream moved?".
#
# Output assets follow the launcher convention: convert-macOS.zip + convert-Windows-x64.exe (arm64 optional).
# The release is published UNSIGNED here; the maintainer signs its SHA256SUMS separately (offline key).
name: Desktop build (tracks upstream)

on:
  schedule:
    - cron: '0 6 1,15 * *'   # 1st & 15th of the month, ~06:00 UTC — fortnightly cap
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a build even if upstream has not moved since the last release'
        type: boolean
        default: false

# Least privilege: nothing gets write by default; only the `release` job may write releases (see its block).
permissions:
  contents: read

concurrency:
  group: desktop-build
  cancel-in-progress: false

jobs:
  check:
    name: has upstream moved?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      upstream_sha: ${{ steps.cmp.outputs.upstream_sha }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          up="$(gh api repos/p2r3/convert/commits/master --jq '.sha')"
          echo "upstream_sha=$up" >> "$GITHUB_OUTPUT"
          # the last built upstream sha is recorded in the latest release body marker "built-from: <sha>"
          last="$(gh api repos/${{ github.repository }}/releases/latest --jq '.body' 2>/dev/null | sed -n 's/.*built-from: \([0-9a-f]\{7,\}\).*/\1/p' | head -1)"
          if [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "forced build (manual dispatch) — upstream at $up"
          elif [ "${up:0:12}" = "${last:0:12}" ] && [ -n "$last" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "upstream unchanged ($up) — skipping the build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "upstream moved to $up (last built: ${last:-none}) — building"
          fi

  build-macos:
    name: build-macos
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: macos-14          # Apple Silicon; electron-builder emits a UNIVERSAL mac zip from this one runner (cost)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p2r3/convert            # build UPSTREAM's code, unmodified...
          ref: ${{ needs.check.outputs.upstream_sha }}   # ...at the exact sha the check job reported
          submodules: recursive               # upstream requires submodules
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install                       # upstream commits no lockfile, so a plain (non-frozen) install
      - name: Build universal mac zip (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # never try to discover/attach a signing cert in CI
        run: |
          bun run desktop:build
          bunx electron-builder --mac zip --universal --publish never -c.mac.identity=null
      - name: Rename to launcher convention
        run: |
          mkdir -p staging
          zip="$(find release -maxdepth 1 -name '*.zip' ! -name '*.blockmap' | head -1)"
          if [ -z "$zip" ]; then echo "::error::no mac .zip produced"; ls -la release; exit 1; fi
          mv "$zip" staging/convert-macOS.zip
          ls -la staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convert-macOS
          path: staging/convert-macOS.zip
          if-no-files-found: error

  build-windows:
    name: build-windows-x64
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: p2r3/convert
          ref: ${{ needs.check.outputs.upstream_sha }}
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build shared desktop bundle
        shell: bash
        run: bun run desktop:build
      - name: Package x64 installer (required)
        shell: bash
        run: |
          bunx electron-builder --win --x64 --publish never
          mkdir -p staging
          exe="$(find release -maxdepth 1 -name '*.exe' | head -1)"
          if [ -z "$exe" ]; then echo "::error::no Windows x64 .exe produced"; ls -la release; exit 1; fi
          mv "$exe" staging/convert-Windows-x64.exe
      - name: Package arm64 installer (optional)
        shell: bash
        continue-on-error: true
        run: |
          rm -f release/*.exe
          bunx electron-builder --win --arm64 --publish never
          exe="$(find release -maxdepth 1 -name '*.exe' | head -1)"
          if [ -n "$exe" ]; then mv "$exe" staging/convert-Windows-arm64.exe; else echo "arm64 build produced no .exe — skipping"; fi
      - name: List staged artifacts
        shell: bash
        run: ls -la staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convert-Windows
          path: staging/*.exe
          if-no-files-found: error

  release:
    name: publish (unsigned)
    needs: [check, build-macos, build-windows]
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only this job writes the Release (least privilege)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Assemble assets + checksums
        run: |
          mkdir -p flat
          find artifacts -type f \( -name 'convert-*.zip' -o -name 'convert-*.exe' \) -exec cp {} flat/ \;
          cd flat
          ls -la
          test -f convert-macOS.zip       || { echo "::error::missing convert-macOS.zip"; exit 1; }
          test -f convert-Windows-x64.exe || { echo "::error::missing convert-Windows-x64.exe"; exit 1; }
          sha256sum -- * > SHA256SUMS
          echo "--- SHA256SUMS ---"; cat SHA256SUMS
      - name: Publish release (date-tagged, unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
          UP_SHA: ${{ needs.check.outputs.upstream_sha }}
        run: |
          D="$(date -u +%Y%m%d)"
          tag="build-$D"
          # re-run safe: replace a same-day release/tag if one already exists
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          {
            echo "Unsigned desktop repackaging of [p2r3/convert](https://github.com/p2r3/convert) (\"Convert to it!\"),"
            echo "built for the JBTheatreTools launcher. All credit to the original authors; app unmodified except for packaging."
            echo ""
            echo "built-from: $UP_SHA"
            echo ""
            echo "Assets are UNSIGNED. \`SHA256SUMS\` is signed offline afterwards by the maintainer; verify \`SHA256SUMS.minisig\` against the pinned public key."
          } > notes.md
          gh release create "$tag" flat/convert-*.zip flat/convert-*.exe flat/SHA256SUMS \
            --title "Convert desktop — $D" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
